[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo2uml"
version = "0.1.0"
description = "Automatic architecture mapper: GitHub repo -> UML (PlantUML)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
repo2uml = "repo2uml.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repo2uml*"]
