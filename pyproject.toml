[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghubuml"
version = "0.1.0"
description = "Automatic architecture mapper: GitHub repo -> UML (PlantUML)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ghubuml = "ghubuml.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghubuml*"]
